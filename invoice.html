              </svg>
              <input className="topnav-search" placeholder="Search" style={{paddingLeft:'32px'}} />
            </div>
            <button className="topnav-icon-btn" title="Add">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 5V15M5 10H15" stroke="white" strokeWidth="1.5" strokeLinecap="round"/></svg>
            </button>
            <button className="topnav-icon-btn" title="Notifications">
              <svg width="15" height="17" viewBox="0 0 15 17" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.46934 0.00011506C10.8367 0.025573 13.5623 2.76972 13.6539 6.14562L13.6559 6.3214V6.87512C13.6559 9.17622 14.0515 10.8021 14.6715 11.8693C14.8974 12.2552 14.9003 12.7329 14.6783 13.1212C14.4734 13.4795 14.1061 13.7116 13.6979 13.7462L13.5943 13.7501H10.5465C10.5465 15.476 9.14737 16.8751 7.42149 16.8751C5.74102 16.8751 4.3704 15.5489 4.29942 13.8859L4.29649 13.7501H1.24668C0.799263 13.749 0.386604 13.5087 0.164654 13.1202C-0.0571361 12.7318 -0.0545461 12.2542 0.170513 11.8702C0.766979 10.844 1.15503 9.30549 1.18516 7.14855L1.18711 6.87512V6.25109C1.18487 4.58758 1.84694 2.99199 3.02598 1.81847C4.20522 0.644901 5.80479 -0.00998248 7.46934 0.00011506ZM5.54649 13.7501C5.54649 14.7856 6.38596 15.6251 7.42149 15.6251C8.42003 15.6251 9.23653 14.8447 9.29356 13.8605L9.29649 13.7501H5.54649ZM7.2711 1.25304C6.00917 1.29322 4.80601 1.81034 3.90782 2.70422C3.00968 3.59809 2.4872 4.7983 2.44102 6.06066L2.43711 6.25012V6.87512C2.43711 9.28646 2.02441 11.0802 1.33751 12.3448L1.24961 12.5011H13.5934L13.5055 12.3448C12.8476 11.1332 12.4415 9.43568 12.4088 7.17394L12.4059 6.87512V6.3214C12.4059 3.59902 10.2757 1.35702 7.61387 1.25402L7.45958 1.25012L7.2711 1.25304Z" fill="white"/></svg>
            </button>
            <button className="topnav-icon-btn" title="Directory">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="white" strokeWidth="1.5"/><path d="M4 17C4 14 6.7 12 10 12C13.3 12 16 14 16 17" stroke="white" strokeWidth="1.5" strokeLinecap="round"/></svg>
            </button>
            <button className="topnav-icon-btn" title="Help">
              <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.125 0C12.6123 0 16.25 3.63769 16.25 8.125C16.25 12.6123 12.6123 16.25 8.125 16.25C3.63769 16.25 0 12.6123 0 8.125C0 3.63769 3.63769 0 8.125 0ZM8.125 1.25C4.32804 1.25 1.25 4.32804 1.25 8.125C1.25 11.922 4.32804 15 8.125 15C11.922 15 15 11.922 15 8.125C15 4.32804 11.922 1.25 8.125 1.25ZM8.125 11.25C8.64277 11.25 9.0625 11.6697 9.0625 12.1875C9.0625 12.7053 8.64277 13.125 8.125 13.125C7.60723 13.125 7.1875 12.7053 7.1875 12.1875C7.1875 11.6697 7.60723 11.25 8.125 11.25ZM8.125 3.75C9.67817 3.75002 10.9373 5.00937 10.9375 6.5625C10.9375 7.84787 10.0751 8.93187 8.89746 9.26758L8.74902 9.30469L8.75 9.375C8.75 9.69539 8.50889 9.95981 8.19824 9.99609L8.125 10C7.80448 10 7.54001 9.75908 7.50391 9.44824L7.5 9.375V8.75C7.50019 8.40498 7.77994 8.125 8.125 8.125C8.98793 8.12498 9.6875 7.42543 9.6875 6.5625C9.68731 5.69973 8.98781 5.00002 8.125 5C7.29662 5 6.6184 5.64497 6.56543 6.45996L6.5625 6.5625C6.5625 6.90766 6.28266 7.18748 5.9375 7.1875C5.59232 7.1875 5.3125 6.90768 5.3125 6.5625C5.31269 5.00936 6.57182 3.75 8.125 3.75Z" fill="white"/></svg>
            </button>
            <button className="topnav-icon-btn" title="Profile">
              <span className="topnav-avatar">MR</span>
            </button>
          </div>
        </div>
      );
    }

    /* ─── Job Sidebar ─── */
    function JobSidebar({ open, onToggle, selectedJob, onSelectJob }) {
      const [search, setSearch] = useState('');
      const filtered = JOBS.filter(j => j.name.toLowerCase().includes(search.toLowerCase()));
      const openJobs = filtered.filter(j => j.group === 'open');
      const allJobs = filtered.filter(j => j.group === 'all');
      return (
        <div className={"job-sidebar" + (open ? "" : " collapsed")}>
          <div className="job-sidebar-inner">
            <div className="job-sidebar-header">
              <button className="btn-g" style={{fontSize: 12}}>&#8592; Back to Summary</button>
              <button className="job-sidebar-toggle" onClick={onToggle} title="Collapse">&#10005;</button>
            </div>
            <button className="job-new-btn">New Job</button>
            <div style={{padding: '0 16px 4px', display: 'flex', alignItems: 'center', gap: 6}}>
              <span style={{fontSize: 13, fontWeight: 600, color: 'var(--g700)'}}>Jobs</span>
              <span style={{fontSize: 11, color: 'var(--g400)'}}>(1) &#9660;</span>
            </div>
            <input className="job-search" placeholder="Search jobs..." value={search} onChange={e => setSearch(e.target.value)} />
            <div className="job-list">
              {openJobs.length > 0 && <div className="job-group">Open</div>}
              {openJobs.map(j => (
                <div key={j.id} className={"job-item" + (selectedJob === j.id ? " active" : "")} onClick={() => onSelectJob(j.id)}>
                  <div className="job-item-name">{j.name}</div>
                  {j.addr && <div className="job-item-addr">{j.addr.split('\n').map((l,i) => <span key={i}>{l}<br/></span>)}</div>}
                </div>
              ))}
              {allJobs.length > 0 && <div className="job-group">All Jobs</div>}
              {allJobs.map(j => (
                <div key={j.id} className={"job-item" + (selectedJob === j.id ? " active" : "")} onClick={() => onSelectJob(j.id)}>
                  <div className="job-item-name">
                    {j.name}
                    {j.tag && <span style={{marginLeft: 6, padding: '1px 5px', fontSize: 10, fontWeight: 600, background: 'var(--green-bg)', color: 'var(--green)', borderRadius: 3}}>{j.tag}</span>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ─── Column Visibility Toggle ─── */
    function ColumnToggle({ columns, onChange }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        if (!open) return;
        const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [open]);

      const visCount = ALL_COLUMNS.filter(c => columns[c.key] && !c.alwaysOn).length;
      const totalToggleable = ALL_COLUMNS.filter(c => !c.alwaysOn).length;

      const showAll = () => {
        const next = {...columns};
        ALL_COLUMNS.forEach(c => { if (!c.alwaysOn) next[c.key] = true; });
        onChange(next);
      };
      const hideAll = () => {
        const next = {...columns};
        ALL_COLUMNS.forEach(c => { if (!c.alwaysOn) next[c.key] = false; });
        onChange(next);
      };
      const toggle = (key) => onChange({...columns, [key]: !columns[key]});

      return (
        <div className="col-vis-wrap" ref={ref}>
          <button className="col-vis-trigger" onClick={() => setOpen(!open)}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Columns
            {visCount < totalToggleable && <span className="count">{visCount}</span>}
          </button>
          {open && (
            <>
              <div className="col-vis-backdrop" onClick={() => setOpen(false)} />
              <div className="col-vis-pop" style={{zIndex: 30}}>
                <div className="col-vis-pop-header">Toggle columns</div>
                {ALL_COLUMNS.map(col => (
                  <div key={col.key}
                    className={"col-vis-item" + (col.alwaysOn ? " locked" : "")}
                    onClick={() => { if (!col.alwaysOn) toggle(col.key); }}
                  >
                    <div className={"col-vis-check" + (columns[col.key] ? " on" : "")} />
                    <span>{col.label}</span>
                    {col.alwaysOn && <span style={{marginLeft: 'auto', fontSize: 10, color: 'var(--g400)'}}>Required</span>}
                  </div>
                ))}
                <div className="col-vis-pop-footer">
                  <button onClick={showAll}>Show all</button>
                  <button onClick={hideAll}>Hide all</button>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    /* ─── Page Header ─── */
    function PageHeader({ invoice, jobOpen, onToggleJob }) {
      return (
        <div className="pg-hdr">
          <div className="pg-accent"></div>
          <div className="pg-hdr-content">
            <div style={{display: 'flex', alignItems: 'center', gap: 12}}>
              {!jobOpen && (
                <button onClick={onToggleJob} style={{background: 'none', border: '1px solid var(--g200)', borderRadius: 'var(--radius)', padding: '4px 8px', cursor: 'pointer', color: 'var(--g500)', fontSize: 16, display: 'flex', alignItems: 'center', lineHeight: 1}}>
                  &#9776;
                </button>
              )}
              <div>
                <div className="pg-hdr-sub">{invoice.to.name}</div>
                <div className="pg-title">Invoice</div>
              </div>
            </div>
            <div className="pg-hdr-right">
              <span className="status status-unreleased">{invoice.status}</span>
            </div>
          </div>
        </div>
      );
    }

    /* ─── Invoice Info ─── */
    function InvoiceInfo({ invoice, onChange }) {
      const handleDateChange = (date) => {
        const dueDate = calcDueDate(date, invoice.paymentTerms);
        onChange({...invoice, date, dueDate});
      };
      const handleTermsChange = (terms) => {
        const dueDate = calcDueDate(invoice.date, terms);
        onChange({...invoice, paymentTerms: terms, dueDate});
      };
      return (
        <div className="sec">
          <div className="sec-title">Invoice information</div>
          <div className="g3">
            <div><label className="fl">Title</label><input className="fi" value={invoice.title} onChange={e => onChange({...invoice, title: e.target.value})} /></div>
            <div><label className="fl">ID #</label><input className="fi" value={invoice.invoiceNumber} onChange={e => onChange({...invoice, invoiceNumber: e.target.value})} /></div>
            <div><label className="fl">Date Paid</label><input type="date" className="fi" value={invoice.datePaid} onChange={e => onChange({...invoice, datePaid: e.target.value})} /></div>
          </div>
          <div style={{marginTop: 12}}>
            <div className="tabs"><button className="tab on">Invoice date</button><button className="tab">Link to schedule item</button></div>
          </div>
          <div className="g3" style={{marginTop: 12}}>
            <div><label className="fl">Invoice date</label><input type="date" className="fi" value={invoice.date} onChange={e => handleDateChange(e.target.value)} /></div>
            <div><label className="fl">Payment terms</label><select className="fi" value={invoice.paymentTerms} onChange={e => handleTermsChange(e.target.value)}><option>None</option><option>Net 15</option><option>Net 30</option><option>Net 45</option><option>Net 60</option><option>Due on Receipt</option></select></div>
            <div><label className="fl">Due date</label><div style={{padding: '8px 0', fontSize: 14, color: 'var(--g700)', fontWeight: 500}}>{fmtDate(invoice.dueDate)}</div></div>
          </div>
        </div>
      );
    }

    /* ─── Owner Price ─── */
    function OwnerPrice({ invoice, onChange }) {
      return (
        <div className="sec">
          <div className="sec-title">Owner Price</div>
          <div style={{marginBottom: 14}}>
            <label className="fl">Taxes</label>
            <div style={{display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap'}}>
              <select className="fi" style={{width: 180, flexShrink: 0}} value={invoice.taxType} onChange={e => onChange({...invoice, taxType: e.target.value})}><option>No tax</option><option>Sales tax (7.5%)</option><option>Sales tax (8%)</option></select>
              <button className="btn-g">Manage Taxes</button>
            </div>
          </div>
          <div className="tabs">
            <button className={"tab" + (invoice.mode === 'flatFee' ? ' on' : '')} onClick={() => onChange({...invoice, mode: 'flatFee'})}>Flat Fee</button>
            <button className={"tab" + (invoice.mode === 'lineItems' ? ' on' : '')} onClick={() => onChange({...invoice, mode: 'lineItems'})}>Line Items</button>
          </div>
          {invoice.mode === 'flatFee' && (
            <div style={{marginTop: 16}}>
              <label className="fl">Invoice Amount</label>
              <div style={{display: 'flex', alignItems: 'center', gap: 8, maxWidth: 240}}>
                <span style={{fontSize: 16, fontWeight: 600, color: 'var(--g600)'}}>$</span>
                <input type="number" className="fi" style={{fontSize: 18, fontWeight: 700, textAlign: 'right'}} value={invoice.flatFeeAmount || ''} placeholder="0.00" onChange={e => onChange({...invoice, flatFeeAmount: parseFloat(e.target.value) || 0})} />
              </div>
              {parseTaxRate(invoice.taxType) > 0 && (
                <div style={{marginTop: 8, fontSize: 13, color: 'var(--g500)'}}>
                  + Tax ({invoice.taxType.match(/([\d.]+%)/)?.[1]}): <strong style={{color: 'var(--g700)'}}>${fmt(invoice.flatFeeAmount * parseTaxRate(invoice.taxType) / 100)}</strong>
                  <span style={{marginLeft: 12}}>= <strong style={{color: 'var(--bt-midnight)'}}>${fmt(invoice.flatFeeAmount * (1 + parseTaxRate(invoice.taxType) / 100))}</strong></span>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }


    /* ─── Line Item Row ─── */
    function LineRow({ item, onChange, onRemove, vis, taxRate }) {
      const u = (f, v) => onChange({...item, [f]: v});
      const bc = item.unitCost * item.quantity;
      const cp = bc * (1 + item.markup / 100);
      const taxAmt = cp * (taxRate / 100);
      return (
        <tr>
          <td>
            <div><input className="cell-input" style={{fontWeight: 600}} value={item.description} onChange={e => u('description', e.target.value)} /></div>
            <div><input className="cell-input" style={{fontSize: 11, color: 'var(--g400)'}} value={item.costCode} onChange={e => u('costCode', e.target.value)} /></div>
          </td>
          {vis.costType && <td><select className="badge" style={{cursor: 'pointer', fontSize: 12, padding: '2px 6px'}} value={item.costType} onChange={e => u('costType', e.target.value)}>{COST_TYPES.map(t => <option key={t}>{t}</option>)}</select></td>}
          {vis.unitCost && <td style={{textAlign: 'right'}}><input className="cell-input" type="number" style={{textAlign: 'right', width: 90}} value={item.unitCost} onChange={e => u('unitCost', parseFloat(e.target.value) || 0)} /></td>}
          {vis.quantity && <td style={{textAlign: 'center'}}><input className="cell-input" type="number" style={{textAlign: 'center', width: 45}} value={item.quantity} onChange={e => u('quantity', parseFloat(e.target.value) || 0)} /></td>}
          {vis.unit && <td style={{textAlign: 'center', color: 'var(--g400)', fontSize: 12}}>{item.unit}</td>}
          {vis.builderCost && <td style={{textAlign: 'right', fontWeight: 500, fontSize: 13}}>${fmt(bc)}</td>}
          {vis.markup && <td style={{textAlign: 'center', whiteSpace: 'nowrap'}}><input className="cell-input" type="number" style={{textAlign: 'center', width: 45}} value={item.markup} onChange={e => u('markup', parseFloat(e.target.value) || 0)} />%</td>}
          <td style={{textAlign: 'right', fontWeight: 600, fontSize: 13}}>${fmt(cp)}</td>
          {vis.tax && taxRate > 0 && <td style={{textAlign: 'right', fontSize: 12, color: 'var(--g500)'}}>${fmt(taxAmt)}</td>}
          {vis.bill && <td></td>}
          <td style={{width: 32, textAlign: 'center'}}><button className="rr" onClick={onRemove}>&times;</button></td>
        </tr>
      );
    }

    /* ─── Line Items Table ─── */
    function LineItems({ invoice, onChange, vis, onVisChange, onOpenEstimate }) {
      const add = () => onChange({...invoice, lineItems: [...invoice.lineItems, { id: String(nextId++), description: '', costCode: '', costType: 'Material', unitCost: 0, quantity: 1, unit: '--', markup: 0 }]});
      const upd = (i, item) => { const l = [...invoice.lineItems]; l[i] = item; onChange({...invoice, lineItems: l}); };
      const rem = i => onChange({...invoice, lineItems: invoice.lineItems.filter((_, idx) => idx !== i)});
      const tbc = invoice.lineItems.reduce((s, i) => s + i.unitCost * i.quantity, 0);
      const tcp = invoice.lineItems.reduce((s, i) => s + i.unitCost * i.quantity * (1 + i.markup / 100), 0);
      const taxRate = parseTaxRate(invoice.taxType);
      const taxTotal = tcp * (taxRate / 100);
      const grandTotal = tcp + taxTotal;
      return (
        <div className="sec" style={{paddingBottom: 0}}>
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, flexWrap: 'wrap', gap: 8}}>
            <ColumnToggle columns={vis} onChange={onVisChange} />
            <button className="btn btn-s" style={{fontSize: 13, padding: '6px 14px'}} onClick={onOpenEstimate}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              Add from estimate
            </button>
          </div>
          <div className="lt-scroll">
            <table className="lt">
              <thead><tr>
                <th>Items</th>
                {vis.costType && <th>Cost Type</th>}
                {vis.unitCost && <th style={{textAlign: 'right'}}>Unit Cost</th>}
                {vis.quantity && <th style={{textAlign: 'center'}}>Quantity</th>}
                {vis.unit && <th style={{textAlign: 'center'}}>Unit</th>}
                {vis.builderCost && <th style={{textAlign: 'right'}}>Builder Cost</th>}
                {vis.markup && <th style={{textAlign: 'center'}}>Markup</th>}
                <th style={{textAlign: 'right'}}>Client price</th>
                {vis.tax && taxRate > 0 && <th style={{textAlign: 'right'}}>Tax ({taxRate}%)</th>}
                {vis.bill && <th>Bill</th>}
                <th style={{width: 32}}></th>
              </tr></thead>
              <tbody>
                {invoice.lineItems.map((item, i) => <LineRow key={item.id} item={item} onChange={u => upd(i, u)} onRemove={() => rem(i)} vis={vis} taxRate={taxRate} />)}
              </tbody>
            </table>
          </div>
          <div style={{padding: '10px 0'}}><button className="add-btn" onClick={add}><span className="add-icon">+</span> Item</button></div>
          <div className="totals-row" style={{margin: '0 -24px', padding: '12px 24px'}}>
            <span>Total</span>
            <div style={{display: 'flex', gap: 60}}>
              {vis.builderCost && <span>${fmt(tbc)}</span>}
              <span>${fmt(tcp)}</span>
              {vis.tax && taxRate > 0 && <span style={{fontSize: 12, color: 'var(--g500)'}}>+${fmt(taxTotal)}</span>}
            </div>
          </div>
          <div style={{display: 'flex', justifyContent: 'flex-end', padding: '14px 0'}}>
            <div style={{textAlign: 'right'}}>
              {taxRate > 0 && (
                <div style={{fontSize: 13, color: 'var(--g500)', marginBottom: 4}}>
                  Subtotal: ${fmt(tcp)} &nbsp;|&nbsp; Tax: ${fmt(taxTotal)}
                </div>
              )}
              <div style={{fontSize: 14, fontWeight: 700, color: 'var(--bt-midnight)', display: 'flex', gap: 24}}>
                <span>Total price</span><span>${fmt(grandTotal)}</span>
              </div>
              <button className="btn-g" style={{fontSize: 12, marginTop: 4}}>&#9654; Show full price breakdown</button>
            </div>
          </div>
        </div>
      );
    }

    /* ─── Notes ─── */
    function Notes({ invoice, onChange }) {
      return (
        <div style={{borderTop: '1px solid var(--g100)'}}>
          <div className="sec">
            <div className="sec-title" style={{fontSize: 14}}>Invoice Description <span style={{fontWeight: 400, fontSize: 11, color: 'var(--g400)'}}>(visible to client)</span></div>
            <textarea className="fi" style={{resize: 'vertical', minHeight: 72}} placeholder="Add context or details about this invoice for the client..." value={invoice.invoiceDescription} onChange={e => onChange({...invoice, invoiceDescription: e.target.value})} />
          </div>
          <div className="g2">
            <div className="sec" style={{borderRight: '1px solid var(--g100)'}}>
              <div className="sec-title" style={{fontSize: 14}}>Email Message <span style={{fontWeight: 400, fontSize: 11, color: 'var(--g400)'}}>(included in email)</span></div>
              <textarea className="fi" style={{resize: 'vertical', minHeight: 72}} placeholder="Add a personal message to include in the invoice email..." value={invoice.emailMessage} onChange={e => onChange({...invoice, emailMessage: e.target.value})} />
            </div>
            <div className="sec">
              <div className="sec-title" style={{fontSize: 14}}>Internal Notes <span style={{fontWeight: 400, fontSize: 11, color: 'var(--g400)'}}>(builder only)</span></div>
              <textarea className="fi" style={{resize: 'vertical', minHeight: 72}} placeholder="Private notes, not visible to client..." value={invoice.notes} onChange={e => onChange({...invoice, notes: e.target.value})} />
            </div>
          </div>
        </div>
      );
    }

    /* ─── Payment History Editor ─── */
    function PaymentHistory({ invoice, onChange }) {
      const addPayment = () => {
        const p = { id: 'p' + (nextId++), date: new Date().toISOString().split('T')[0], method: 'Credit Card', amount: 0, refund: false };
        onChange({...invoice, payments: [...(invoice.payments || []), p]});
      };
      const updPayment = (i, field, val) => {
        const ps = [...(invoice.payments || [])];
        ps[i] = {...ps[i], [field]: val};
        onChange({...invoice, payments: ps});
      };
      const remPayment = i => onChange({...invoice, payments: (invoice.payments || []).filter((_, idx) => idx !== i)});
      const payments = invoice.payments || [];
      return (
        <div className="sec">
          <div className="sec-title" style={{fontSize: 14}}>Payment History</div>
          {payments.length > 0 && (
            <table style={{width: '100%', borderCollapse: 'collapse', fontSize: 13, marginBottom: 8}}>
              <thead><tr style={{borderBottom: '2px solid var(--g200)'}}>
                <th style={{textAlign: 'left', padding: '6px 8px', fontSize: 11, fontWeight: 600, color: 'var(--g400)'}}>Date</th>
                <th style={{textAlign: 'left', padding: '6px 8px', fontSize: 11, fontWeight: 600, color: 'var(--g400)'}}>Method</th>
                <th style={{textAlign: 'right', padding: '6px 8px', fontSize: 11, fontWeight: 600, color: 'var(--g400)'}}>Amount</th>
                <th style={{textAlign: 'center', padding: '6px 8px', fontSize: 11, fontWeight: 600, color: 'var(--g400)'}}>Refund</th>
                <th style={{width: 32}}></th>
              </tr></thead>
              <tbody>
                {payments.map((p, i) => (
                  <tr key={p.id} style={{borderBottom: '1px solid var(--g100)'}}>
                    <td style={{padding: '6px 8px'}}><input type="date" className="cell-input" value={p.date} onChange={e => updPayment(i, 'date', e.target.value)} /></td>
                    <td style={{padding: '6px 8px'}}><select className="cell-input" style={{cursor: 'pointer'}} value={p.method} onChange={e => updPayment(i, 'method', e.target.value)}><option>Credit Card</option><option>Check</option><option>Cash</option><option>Bank Transfer</option><option>Other</option></select></td>
                    <td style={{padding: '6px 8px', textAlign: 'right'}}><input type="number" className="cell-input" style={{textAlign: 'right', width: 90}} value={p.amount} onChange={e => updPayment(i, 'amount', parseFloat(e.target.value) || 0)} /></td>
                    <td style={{padding: '6px 8px', textAlign: 'center'}}><input type="checkbox" checked={p.refund} onChange={e => updPayment(i, 'refund', e.target.checked)} /></td>
                    <td style={{textAlign: 'center'}}><button className="rr" style={{opacity: 1}} onClick={() => remPayment(i)}>&times;</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
          <button className="add-btn" onClick={addPayment}><span className="add-icon">+</span> Payment</button>
        </div>
      );
    }

    /* ─── Client Preview (Invoice Paper) ─── */
    function ClientPreview({ invoice, clientVis }) {
      const isFlatFee = invoice.mode === 'flatFee';
      const subtotal = isFlatFee
        ? (invoice.flatFeeAmount || 0)
        : invoice.lineItems.reduce((s, i) => s + i.unitCost * i.quantity * (1 + i.markup / 100), 0);
      const taxRate = parseTaxRate(invoice.taxType);
      const taxAmt = subtotal * (taxRate / 100);
      const invoiceTotal = subtotal + taxAmt;
      const payments = invoice.payments || [];
      const totalPaid = payments.reduce((s, p) => s + (p.refund ? -p.amount : p.amount), 0);
      const amountDue = invoiceTotal - totalPaid;

      // Client columns — never show builderCost or markup
      const cols = [];
      cols.push({ key: 'desc', label: 'Description', align: 'left' });
      if (clientVis.costType) cols.push({ key: 'costType', label: 'Type', align: 'left' });
      if (clientVis.quantity) cols.push({ key: 'qty', label: 'Qty', align: 'center' });
      if (clientVis.unit) cols.push({ key: 'unit', label: 'Unit', align: 'center' });
      if (clientVis.unitPrice) cols.push({ key: 'unitPrice', label: 'Price', align: 'right' });
      cols.push({ key: 'amount', label: 'Amount', align: 'right' });
      if (taxRate > 0) cols.push({ key: 'tax', label: 'Tax', align: 'right' });

      const renderCell = (item, c) => {
        const cp = item.unitCost * item.quantity * (1 + item.markup / 100);
        const unitClient = item.unitCost * (1 + item.markup / 100);
        const itemTax = cp * (taxRate / 100);
        switch (c.key) {
          case 'desc': return <td key={c.key} style={{fontWeight: 500, color: 'var(--g800)', whiteSpace: 'normal'}}>{item.description || '—'}</td>;
          case 'costType': return <td key={c.key}><span style={{padding: '1px 6px', fontSize: 10, border: '1px solid var(--g200)', borderRadius: 3}}>{item.costType}</span></td>;
          case 'qty': return <td key={c.key} style={{textAlign: 'center'}}>{item.quantity}</td>;
          case 'unit': return <td key={c.key} style={{textAlign: 'center', color: 'var(--g400)'}}>{item.unit}</td>;
          case 'unitPrice': return <td key={c.key} style={{textAlign: 'right'}}>${fmt(unitClient)}</td>;
          case 'amount': return <td key={c.key} className="amt">${fmt(cp)}</td>;
          case 'tax': return <td key={c.key} style={{textAlign: 'right', color: 'var(--g500)'}}>${fmt(itemTax)}</td>;
          default: return <td key={c.key}></td>;
        }
      };

      return (
        <div className="paper">
          <div className="paper-accent"></div>

          {/* Company header: From left, Bill To right */}
          <div className="paper-sec" style={{padding: '24px 28px'}}>
            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24}}>
              {/* Left: company logo + from address */}
              <div>
                <div className="paper-logo" style={{marginBottom: 12}}>
                  <div className="paper-logo-icon">b</div>
                  <div style={{fontSize: 15, fontWeight: 700, color: 'var(--bt-midnight)'}}>{invoice.from.name}</div>
                </div>
                <div className="paper-val" style={{fontSize: 11, lineHeight: 1.6}}>
                  {invoice.from.address}<br/>
                  {invoice.from.city}, {invoice.from.state} {invoice.from.zip}<br/>
                  Email: {invoice.from.email}<br/>
                  Phone: {invoice.from.phone}
                </div>
              </div>
              {/* Right: Bill To */}
              <div style={{textAlign: 'right'}}>
                <div className="paper-lbl" style={{textAlign: 'right'}}>Bill To</div>
                <div className="paper-val" style={{textAlign: 'right'}}>
                  <strong>{invoice.to.name}</strong><br/>
                  {invoice.to.address}<br/>
                  {invoice.to.city}, {invoice.to.state} {invoice.to.zip}
                </div>
              </div>
            </div>
          </div>

          {/* Invoice meta — compact horizontal strip */}
          <div style={{display: 'flex', alignItems: 'stretch', borderTop: '1px solid var(--g100)', borderBottom: '1px solid var(--g100)', fontSize: 11}}>
            <div style={{flex: 1, padding: '10px 14px 10px 28px', borderRight: '1px solid var(--g100)'}}>
              <div style={{color: 'var(--g400)', fontWeight: 600, fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em'}}>Invoice Date</div>
              <div style={{color: 'var(--g700)', fontWeight: 500, marginTop: 2}}>{fmtDate(invoice.date)}</div>
            </div>
            {invoice.dueDate && (
              <div style={{flex: 1, padding: '10px 14px', borderRight: '1px solid var(--g100)'}}>
                <div style={{color: 'var(--g400)', fontWeight: 600, fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em'}}>Due Date</div>
                <div style={{color: 'var(--g700)', fontWeight: 500, marginTop: 2}}>{fmtDate(invoice.dueDate)}</div>
              </div>
            )}
            {totalPaid > 0 && (
              <div style={{flex: 1, padding: '10px 14px', borderRight: '1px solid var(--g100)'}}>
                <div style={{color: 'var(--g400)', fontWeight: 600, fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em'}}>Paid</div>
                <div style={{color: 'var(--green)', fontWeight: 600, marginTop: 2}}>${fmt(totalPaid)}</div>
              </div>
            )}
            <div style={{flex: 1, padding: '10px 14px 10px', paddingRight: 28, background: amountDue > 0 ? 'var(--bt-blue-light)' : 'var(--green-bg)'}}>
              <div style={{color: amountDue > 0 ? 'var(--bt-blue)' : 'var(--green)', fontWeight: 600, fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em'}}>Amount Due</div>
              <div style={{color: amountDue > 0 ? 'var(--bt-midnight)' : 'var(--green)', fontWeight: 700, fontSize: 14, marginTop: 1}}>${fmt(Math.max(amountDue, 0))}</div>
            </div>
          </div>

          {/* Description of Invoice */}
          {invoice.invoiceDescription && (
            <div className="paper-sec" style={{padding: '14px 28px'}}>
              <div className="paper-lbl">Description of Invoice</div>
              <div style={{fontSize: 11, color: 'var(--g600)', lineHeight: 1.6, whiteSpace: 'pre-wrap', marginTop: 4}}>{invoice.invoiceDescription}</div>
            </div>
          )}

          {/* Line Items */}
          {!isFlatFee && (
            <div className="paper-sec">
              <div style={{overflowX: 'auto'}}>
                <table className="paper-tbl">
                  <thead><tr>{cols.map(c => <th key={c.key} style={{textAlign: c.align}}>{c.label}</th>)}</tr></thead>
                  <tbody>
                    {invoice.lineItems.map(item => <tr key={item.id}>{cols.map(c => renderCell(item, c))}</tr>)}
                    {invoice.lineItems.length === 0 && <tr><td colSpan={cols.length} style={{padding: 24, textAlign: 'center', color: 'var(--g300)', fontStyle: 'italic'}}>No line items</td></tr>}
                  </tbody>
                </table>
              </div>
              <div className="paper-totals">
                <div className="paper-totals-box" style={{width: 200}}>
                  <div className="paper-t-row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
                  {taxRate > 0 && <div className="paper-t-row"><span>Tax ({taxRate}%)</span><span>${fmt(taxAmt)}</span></div>}
                  {taxRate === 0 && <div className="paper-t-row"><span>Tax</span><span>$0.00</span></div>}
                  <div className="paper-t-final"><span>Total</span><span>${fmt(invoiceTotal)}</span></div>
                </div>
              </div>
            </div>
          )}

          {isFlatFee && (
            <div className="paper-sec" style={{textAlign: 'center', padding: '28px'}}>
              <div style={{fontSize: 13, color: 'var(--g500)', marginBottom: 4}}>Flat Fee Invoice</div>
              <div style={{fontSize: 22, fontWeight: 700, color: 'var(--bt-midnight)'}}>${fmt(subtotal)}</div>
              {taxRate > 0 && <div style={{fontSize: 12, color: 'var(--g500)', marginTop: 4}}>+ Tax: ${fmt(taxAmt)} = ${fmt(invoiceTotal)}</div>}
            </div>
          )}

          {/* Payment History */}
          {payments.length > 0 && (
            <div className="paper-sec">
              <div style={{fontSize: 11, fontWeight: 600, color: 'var(--bt-midnight)', marginBottom: 8}}>Payment History</div>
              <table className="paper-tbl">
                <thead><tr>
                  <th>Date</th>
                  <th>Payment Method</th>
                  <th>Refund</th>
                  <th style={{textAlign: 'right'}}>Status</th>
                </tr></thead>
                <tbody>
                  {payments.map(p => (
                    <tr key={p.id}>
                      <td>{fmtDate(p.date)}</td>
                      <td>{p.method}</td>
                      <td>{p.refund ? 'Yes' : ''}</td>
                      <td style={{textAlign: 'right', fontWeight: 600, color: 'var(--g800)'}}>${fmt(p.amount)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Notes */}
          {invoice.notes && (
            <div className="paper-sec" style={{padding: '14px 28px'}}>
              <div className="paper-lbl">Notes</div>
              <div style={{fontSize: 11, color: 'var(--g500)', lineHeight: 1.6, whiteSpace: 'pre-wrap', marginTop: 2}}>{invoice.notes}</div>
            </div>
          )}

          <div className="paper-footer">Generated with Buildertrend &middot; Thank you for your business</div>
        </div>
      );
    }

    /* ─── Email Preview ─── */
    function EmailPreview({ invoice }) {
      const isFlatFee = invoice.mode === 'flatFee';
      const subtotal = isFlatFee ? (invoice.flatFeeAmount || 0) : invoice.lineItems.reduce((s, i) => s + i.unitCost * i.quantity * (1 + i.markup / 100), 0);
      const taxRate = parseTaxRate(invoice.taxType);
      const taxAmt = subtotal * (taxRate / 100);
      const invoiceTotal = subtotal + taxAmt;
      const totalPaid = (invoice.payments || []).reduce((s, p) => s + (p.refund ? -p.amount : p.amount), 0);
      const tcp = Math.max(invoiceTotal - totalPaid, 0);
      return (
        <div className="email-wrap">
          <div className="email-subject-bar">
            <div className="email-subject-label">Subject</div>
            <div className="email-subject-text">Invoice #{invoice.invoiceNumber} from {invoice.from.name}</div>
          </div>
          <div className="email-subject-bar" style={{marginBottom: 16}}>
            <div style={{display: 'flex', justifyContent: 'space-between', fontSize: 12, color: 'var(--g500)'}}>
              <span><strong style={{color: 'var(--g700)'}}>To:</strong> {invoice.to.email || invoice.to.name}</span>
              <span><strong style={{color: 'var(--g700)'}}>From:</strong> {invoice.from.email}</span>
            </div>
          </div>
          <div className="email-outer">
            <div className="email-card">
              <div className="email-brand">
                <div className="email-brand-logo">b</div>
                <div style={{fontSize: 13, fontWeight: 600, color: 'var(--bt-midnight)', marginTop: 8}}>{invoice.from.name}</div>
              </div>
              <div className="email-body">
                <h2>You have a new invoice</h2>
                <div className="email-sub">Invoice #{invoice.invoiceNumber} &middot; {invoice.title}</div>

                <div className="email-amount-card">
                  <div className="email-amount-label">Amount Requested</div>
                  <div className="email-amount">${fmt(tcp)}</div>
                  <div className="email-due">Due {fmtDate(invoice.dueDate)} &middot; {invoice.paymentTerms}</div>
                </div>

                <div className="email-details">
                  <div className="email-detail-row">
                    <span className="email-detail-label">Invoice #</span>
                    <span className="email-detail-value">{invoice.invoiceNumber}</span>
                  </div>
                  <div className="email-detail-row">
                    <span className="email-detail-label">Invoice Date</span>
                    <span className="email-detail-value">{fmtDate(invoice.date)}</span>
                  </div>
                  <div className="email-detail-row">
                    <span className="email-detail-label">Due Date</span>
                    <span className="email-detail-value">{fmtDate(invoice.dueDate)}</span>
                  </div>
                  <div className="email-detail-row">
                    <span className="email-detail-label">Bill To</span>
                    <span className="email-detail-value">{invoice.to.name}</span>
                  </div>
                  {invoice.lineItems.length > 0 && (
                    <div className="email-detail-row">
                      <span className="email-detail-label">Line Items</span>
                      <span className="email-detail-value">{invoice.lineItems.length} item{invoice.lineItems.length !== 1 ? 's' : ''}</span>
                    </div>
                  )}
                </div>

                {invoice.emailMessage && (
                  <div className="email-msg">{invoice.emailMessage}</div>
                )}

                <button className="email-cta">View Invoice & Pay</button>

                <div style={{fontSize: 11, color: 'var(--g400)', textAlign: 'center'}}>
                  You can view the full invoice details and make a payment by clicking the button above.
                </div>
              </div>
              <div className="email-footer">
                Sent via Buildertrend on behalf of {invoice.from.name}<br/>
                {invoice.from.address}, {invoice.from.city}, {invoice.from.state} {invoice.from.zip}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ─── Client Column Toggle (for right panel) ─── */
    const CLIENT_COLUMNS = [
      { key: 'costType', label: 'Cost Type' },
      { key: 'quantity', label: 'Quantity' },
      { key: 'unit', label: 'Unit' },
      { key: 'unitPrice', label: 'Unit Price' },
    ];

    function ClientColumnToggle({ columns, onChange }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        if (!open) return;
        const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [open]);
      const toggle = (key) => onChange({...columns, [key]: !columns[key]});
      return (
        <div style={{position: 'relative', display: 'inline-block'}} ref={ref}>
          <button className="client-col-btn" onClick={() => setOpen(!open)}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Customize
          </button>
          {open && (
            <>
              <div className="col-vis-backdrop" onClick={() => setOpen(false)} />
              <div className="col-vis-pop" style={{zIndex: 30, right: 0, left: 'auto'}}>
                <div className="col-vis-pop-header">Client sees</div>
                <div className="col-vis-item locked">
                  <div className="col-vis-check on" /><span>Description</span><span style={{marginLeft: 'auto', fontSize: 10, color: 'var(--g400)'}}>Always</span>
                </div>
                {CLIENT_COLUMNS.map(col => (
                  <div key={col.key} className="col-vis-item" onClick={() => toggle(col.key)}>
                    <div className={"col-vis-check" + (columns[col.key] ? " on" : "")} />
                    <span>{col.label}</span>
                  </div>
                ))}
                <div className="col-vis-item locked">
                  <div className="col-vis-check on" /><span>Amount</span><span style={{marginLeft: 'auto', fontSize: 10, color: 'var(--g400)'}}>Always</span>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    /* ─── Estimate Modal Data ─── */
    const ESTIMATE_DATA = [
      {
        id: 'g1', type: 'allowance', name: 'Cabinets', clientPrice: 10000,
        children: [
          { id: 'g1a', lineItem: 'Cabinets', costCode: '12.20 Cabinets', selection: 'Allowance', price: 24000, newInvoiceAmt: -24000 },
          { id: 'g1b', lineItem: 'Custom cabinetry', costCode: '12.20 Cabinets', selection: 'Premium custom package', price: 20000, newInvoiceAmt: 20000 },
          { id: 'g1c', lineItem: 'Cabinet install', costCode: '12.15 Cabinet Install labor', selection: 'Premium custom package', price: 14800, newInvoiceAmt: 14800 },
        ]
      },
      {
        id: 'g2', type: 'allowance', name: 'Bedroom floor', clientPrice: 500, children: []
      },
      {
        id: 'g3', type: 'allowance', name: 'Light fixtures', clientPrice: 0,

    /* ─── Signature Pad ─── */
    function SignaturePad({ dataUrl, onChange }) {
      const canvasRef = useRef(null);
      const [drawing, setDrawing] = useState(false);
      const [hasDrawn, setHasDrawn] = useState(!!dataUrl);

      useEffect(() => {
        if (dataUrl && canvasRef.current) {
          const ctx = canvasRef.current.getContext('2d');
          const img = new Image();
          img.onload = () => { ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height); ctx.drawImage(img, 0, 0); };
          img.src = dataUrl;
        }
      }, []);

      const getPos = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const scaleX = canvasRef.current.width / rect.width;
        const scaleY = canvasRef.current.height / rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
      };

      const startDraw = (e) => {
        e.preventDefault();
        const ctx = canvasRef.current.getContext('2d');
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.strokeStyle = '#1f2937';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        setDrawing(true);
        setHasDrawn(true);
      };

      const draw = (e) => {
        if (!drawing) return;
        e.preventDefault();
        const ctx = canvasRef.current.getContext('2d');
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      };

      const endDraw = () => {
        if (!drawing) return;
        setDrawing(false);
        if (canvasRef.current) onChange(canvasRef.current.toDataURL());
      };

      const clear = () => {
        const ctx = canvasRef.current.getContext('2d');
        ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
        setHasDrawn(false);
        onChange('');
      };

      return (
        <div className="sig-pad-wrap">
          <canvas ref={canvasRef} width={600} height={200}
            onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw}
            onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw}
          />
          {!hasDrawn && <div className="sig-pad-placeholder">Draw your signature</div>}
          {hasDrawn && <button className="sig-pad-clear" onClick={clear}>Clear</button>}
        </div>
      );
    }

                <li>There are no liens, claims, or encumbrances against the work covered by this invoice; and</li>

            </div>

            <div style={{fontSize: 12, color: 'var(--g500)', lineHeight: 1.7, marginBottom: 12}}>
              Based on site observations and the information provided in this application, the Architect confirms that
              the work has progressed as shown, meets the requirements of the contract documents, and that the
              Contractor is entitled to payment of the Amount Certified.
              <br/><br/>
              If the Amount Certified differs from the amount requested, an explanation and any revised figures is
              attached to this application and shown on the continuation sheet.
            </div>
            <div className="g3" style={{marginBottom: 12}}>

            </div>
            <label className="fl">Draw your signature</label>

              <SignaturePad dataUrl={architect.signature || ''} onChange={val => update('architect', 'signature', val)} />
            </div>

    function ProgressInvoiceModal({ open, onClose, invoice }) {
      if (!open) return null;

      const lineItems = invoice.lineItems || [];
      const taxRate = parseTaxRate(invoice.taxType);
      const isFlatFee = invoice.mode === 'flatFee';

      // Scheduled values (original contract = sum of base costs)
      const originalContract = isFlatFee
        ? (invoice.flatFeeAmount || 0)
        : lineItems.reduce((s, i) => s + i.unitCost * i.quantity * (1 + i.markup / 100), 0);

      // Change orders — for demo, use 0 unless we have data
      const totalChangeOrders = 0;
      const contractSum = originalContract + totalChangeOrders;

      // Completed & stored to date
      const completedStored = lineItems.reduce((s, i) => s + i.unitCost * i.quantity * (1 + i.markup / 100), 0);
      const retainage = 0;
      const totalEarned = completedStored - retainage;

      // Previous certificates
      const payments = invoice.payments || [];
      const previousCerts = payments.reduce((s, p) => s + (p.refund ? -p.amount : p.amount), 0);
      const currentPaymentDue = totalEarned - previousCerts;
      const balanceToFinish = contractSum - totalEarned;

      const cert = invoice.certification || {};
      const contractor = cert.contractor || {};
      const architect = cert.architect || {};

      const handlePrint = () => window.print();

      return ReactDOM.createPortal(
        <div className="modal-backdrop" onClick={onClose}>
          <div className="pi-modal" onClick={e => e.stopPropagation()}>
            {/* Header */}
            <div className="est-modal-hdr">
              <div>
                <div className="est-modal-hdr-sub">{invoice.to.name}</div>
                <h2>Progress invoice</h2>
              </div>
              <button className="est-modal-close" onClick={onClose}>&times;</button>
            </div>

            {/* Body — two pages */}
            <div className="pi-modal-body">
              {/* PAGE 1 — Cover page */}
              <div className="pi-page">
                {/* Company header */}
                <div className="pi-header">
                  <div className="pi-header-logo">
                    <div className="pi-header-logo-icon">b</div>
                    <div>
                      <div style={{fontSize: 18, fontWeight: 700, color: 'var(--bt-midnight)'}}>{invoice.from.name}</div>
                      <div style={{fontSize: 12, color: 'var(--g400)'}}>Custom Homebuilders</div>
                    </div>
                  </div>
                  <div className="pi-header-right">
                    {invoice.from.name}<br/>
                    {invoice.from.address}<br/>
                    {invoice.from.city}, {invoice.from.state} {invoice.from.zip}<br/>
                    Email: {invoice.from.email}<br/>
                    Phone: {invoice.from.phone}
                  </div>
                </div>

                {/* Client address + application info */}
                <div className="pi-client-row">
                  <div>
                    <div className="pi-lbl">Client address</div>
                    <div className="pi-val">
                      {invoice.to.name}<br/>
                      {invoice.to.address}<br/>
                      {invoice.to.city}, {invoice.to.state} {invoice.to.zip}
                    </div>
                  </div>
                  <div className="pi-meta-right">
                    <div><strong>Application #:</strong> {invoice.invoiceNumber}</div>
                    <div><strong>Invoice date:</strong> {fmtDate(invoice.date)}</div>
                    <div><strong>Amount due:</strong> ${fmt(Math.max(currentPaymentDue, 0))}</div>
                  </div>
                </div>

                {/* Two-column: Application for Payment + Contractor Certification */}
                <div className="pi-two-col">
                  <div>
                    <h2 style={{fontSize: 15}}>Application for Payment</h2>
                    <div className="pi-app-line">
                      <span className="pi-app-line-label">1. Original contract amount</span>
                      <span className="pi-app-line-dots"></span>
                      <span className="pi-app-line-val">${fmt(originalContract)}</span>
                    </div>
                    <div className="pi-app-line">
                      <span className="pi-app-line-label">2. Total change orders</span>
                      <span className="pi-app-line-dots"></span>
                      <span className="pi-app-line-val">${fmt(totalChangeOrders)}</span>
                    </div>
                    <div className="pi-app-line bold">
                      <span className="pi-app-line-label">3. Total contract sum (Line 1 + 2)</span>
                      <span className="pi-app-line-dots"></span>
                      <span className="pi-app-line-val">${fmt(contractSum)}</span>
                    </div>
                    <div className="pi-app-line">
                      <span className="pi-app-line-label">4. Total completed & stored to date</span>
                      <span className="pi-app-line-dots"></span>
                      <span className="pi-app-line-val">${fmt(completedStored)}</span>
                    </div>
                    <div style={{paddingLeft: 16, fontSize: 11, color: 'var(--g400)', marginBottom: 4}}>
                      ("Completed & stored to date" column on continuation sheet)
                    </div>
                    <div className="pi-app-line">
                      <span className="pi-app-line-label">5. Total retainage</span>
                      <span className="pi-app-line-dots"></span>
                      <span className="pi-app-line-val">${fmt(retainage)}</span>
                    </div>
                    <div style={{paddingLeft: 16, fontSize: 11, color: 'var(--g400)', marginBottom: 4}}>
                      (Line 5a + 5b or Total in "Retainage" column)
                    </div>
                    <div className="pi-app-line bold">
                      <span className="pi-app-line-label">6. Total earned &minus; retainage</span>
                      <span className="pi-app-line-dots"></span>
                      <span className="pi-app-line-val">${fmt(totalEarned)}</span>
                    </div>
                    <div style={{paddingLeft: 16, fontSize: 11, color: 'var(--g400)', marginBottom: 4}}>
                      (Line 4 &minus; Line 5 total)
                    </div>
                    <div className="pi-app-line">
                      <span className="pi-app-line-label">7. Less previous certificates for payment</span>
                      <span className="pi-app-line-dots"></span>
                      <span className="pi-app-line-val">${fmt(previousCerts)}</span>
                    </div>
                    <div className="pi-app-line bold">
                      <span className="pi-app-line-label">8. Current payment due</span>
                      <span className="pi-app-line-dots"></span>
                      <span className="pi-app-line-val">${fmt(Math.max(currentPaymentDue, 0))}</span>
                    </div>
                    <div className="pi-app-line">
                      <span className="pi-app-line-label">9. Balance to finish, including retainage</span>
                      <span className="pi-app-line-dots"></span>
                      <span className="pi-app-line-val">${fmt(Math.max(balanceToFinish, 0))}</span>
                    </div>
                    <div style={{paddingLeft: 16, fontSize: 11, color: 'var(--g400)'}}>
                      (Line 3 &minus; Line 6)
                    </div>
                  </div>

                  {/* Contractor Certification */}
                  <div>
                    <h2 style={{fontSize: 15}}>Contractor certification</h2>
                    <div className="pi-cert">
                      By submitting this invoice, the Contractor certifies to the best of their knowledge that:
                      <ul>
                        <li>All work billed has been delivered or performed in accordance with the contract documents and applicable standards;</li>
                        <li>The amounts stated accurately reflect work completed and are due under the contract;</li>
                        <li>All prior payments received have been properly applied to subcontractors, suppliers, and other obligations related to previous work;</li>
                        <li>There are no liens, claims, or encumbrances against the work covered by this invoice; and</li>
                        <li>Based on completion of work and compliance with contract terms, payment in the amount stated is now due and payable.</li>
                      </ul>
                    </div>
                    <div className="pi-cert-sig-row">
                      <div className="pi-cert-field">
                        <div className="pi-cert-field-label">Name</div>
                        <div className="pi-cert-field-val">{contractor.firstName || ''} {contractor.lastName || ''}</div>
                      </div>
                      <div className="pi-cert-field" style={{marginLeft: 'auto'}}>
                        <div className="pi-cert-field-label">Date</div>
                        <div className="pi-cert-field-val">{fmtDate(contractor.date) || ''}</div>
                      </div>
                    </div>
                    <div style={{marginTop: 10}}>
                      <div className="pi-cert-field-label">Signature</div>
                      <div className="pi-cert-sig-img">
                        {contractor.signature && <img src={contractor.signature} alt="Contractor signature" />}
                      </div>
                    </div>
                  </div>
                </div>

                {/* Change Order Summary */}
                <hr className="pi-divider" />
                <h2 style={{fontSize: 15}}>Change order summary</h2>
                <div style={{borderTop: '2px solid var(--g200)', paddingTop: 8}}>
                  <div className="pi-co-line">
                    <span>Total changes approved in previous application</span>
                    <span className="pi-co-line-dots"></span>
                    <span style={{fontWeight: 600}}>${fmt(0)}</span>
                  </div>
                  <div className="pi-co-line">
                    <span>Total changes approved this application</span>
                    <span className="pi-co-line-dots"></span>
                    <span style={{fontWeight: 600}}>${fmt(0)}</span>
                  </div>
                  <div className="pi-co-line" style={{fontWeight: 600, color: 'var(--bt-midnight)'}}>
                    <span>Total change order amount</span>
                    <span className="pi-co-line-dots"></span>
                    <span>${fmt(totalChangeOrders)}</span>
                  </div>
                </div>
              </div>

              {/* PAGE 2 — Continuation Sheet */}
              <div className="pi-page">
                <h2 style={{fontSize: 15, marginBottom: 20}}>Continuation sheet</h2>
                <table className="pi-tbl">
                  <thead>
                    <tr>
                      <th>Description</th>
                      <th>Scheduled value</th>
                      <th>Previous invoice</th>
                      <th>This invoice</th>
                      <th>Stored materials</th>
                      <th>Completed</th>
                      <th>% complete</th>
                      <th>Balance to finish</th>
                      <th>Retainage</th>
                    </tr>
                  </thead>
                  <tbody>
                    {lineItems.map(item => {
                      const scheduled = item.unitCost * item.quantity * (1 + item.markup / 100);
                      return (
                        <tr key={item.id}>
                          <td>{item.description || '—'}</td>
                          <td>${fmt(scheduled)}</td>
                          <td>$0.00</td>
                          <td>$0.00</td>
                          <td>$0.00</td>
                          <td>$0.00</td>
                          <td>0%</td>
                          <td>${fmt(scheduled)}</td>
                          <td>$0.00</td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot>
                    <tr>
                      <td>Total:</td>
                      <td>${fmt(originalContract)}</td>
                      <td>$0.00</td>
                      <td>$0.00</td>
                      <td>$0.00</td>
                      <td>$0.00</td>
                      <td>--%</td>
                      <td>${fmt(originalContract)}</td>
                      <td>$0.00</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>

            {/* Footer */}
            <div className="est-modal-footer">
              <button className="btn btn-s" onClick={handlePrint}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                Print
              </button>
              <button className="btn btn-p" onClick={onClose}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                Send
              </button>
            </div>
          </div>
        </div>,
        document.body
      );
    }

    /* ═══════ APP ═══════ */
    function App() {
      const [invoice, setInvoice] = useState(defaultInvoice);
      const [jobOpen, setJobOpen] = useState(true);
      const [selectedJob, setSelectedJob] = useState(1);
      const [activeView, setActiveView] = useState('builder');
      const [previewTab, setPreviewTab] = useState('client'); // 'client' | 'email'

      // Builder column visibility (left side)
      const [vis, setVis] = useState({
        items: true, costType: true, unitCost: true, quantity: true,
        unit: true, builderCost: true, markup: true, clientPrice: true, tax: true, bill: false,
      });

      // Client column visibility (right side — no builder cost / markup)
      const [clientVis, setClientVis] = useState({
        costType: false, quantity: true, unit: false, unitPrice: true,
      });

      // Progress invoice modal
      const [piModalOpen, setPiModalOpen] = useState(false);

      // Estimate modal
      const [estModalOpen, setEstModalOpen] = useState(false);
      const handleAddFromEstimate = (items) => {
        // Convert selected estimate items to invoice line items
        const newItems = items.filter(i => i.type === 'line').map(i => ({
          id: String(nextId++),
          description: i.name,
          costCode: i.costCode,
          costType: i.costType || 'Material',
          unitCost: i.price,
          quantity: 1,
          unit: '--',
          markup: parseFloat(i.pct) || 0,
        }));
        if (newItems.length > 0) {
          setInvoice(inv => ({...inv, lineItems: [...inv.lineItems, ...newItems]}));
        }
      };
      const currentJob = JOBS.find(j => j.id === selectedJob);

      const [isNarrow, setIsNarrow] = useState(window.innerWidth <= 960);
      useEffect(() => {
        const handler = () => {
          const narrow = window.innerWidth <= 960;
          setIsNarrow(narrow);
          if (narrow) setJobOpen(false);
        };
        window.addEventListener('resize', handler);
        return () => window.removeEventListener('resize', handler);
      }, []);

      return (
        <div style={{display: 'flex', flexDirection: 'column', height: '100vh'}}>
          <TopNav />
          <div style={{display: 'flex', flex: 1, minHeight: 0}}>
            <JobSidebar open={jobOpen} onToggle={() => setJobOpen(false)} selectedJob={selectedJob} onSelectJob={(id) => { setSelectedJob(id); if (isNarrow) setJobOpen(false); }} />
            <div className="content-area">
              <PageHeader invoice={invoice} jobOpen={jobOpen} onToggleJob={() => setJobOpen(true)} />

              <div className="view-toggle">
                <div className="tabs">
                  <button className={"tab" + (activeView === 'builder' ? ' on' : '')} onClick={() => setActiveView('builder')}>Builder</button>
                  <button className={"tab" + (activeView === 'preview' ? ' on' : '')} onClick={() => setActiveView('preview')}>Preview</button>
                </div>
              </div>

              <div className="split">
                <div className="builder" style={isNarrow && activeView !== 'builder' ? {display: 'none'} : {}}>
                  <InvoiceInfo invoice={invoice} onChange={setInvoice} />
                  <OwnerPrice invoice={invoice} onChange={setInvoice} />
                  {invoice.mode === 'lineItems' && <LineItems invoice={invoice} onChange={setInvoice} vis={vis} onVisChange={setVis} onOpenEstimate={() => setEstModalOpen(true)} />}
                  <Notes invoice={invoice} onChange={setInvoice} />
                  <PaymentHistory invoice={invoice} onChange={setInvoice} />
                  <CertificationSection invoice={invoice} onChange={setInvoice} />
                </div>
                <div className="preview" style={{...(isNarrow && activeView !== 'preview' ? {display: 'none'} : {}), padding: 0, display: isNarrow && activeView !== 'preview' ? 'none' : 'flex', flexDirection: 'column'}}>
                  {/* Preview header with tabs */}
                  <div className="preview-tabs">
                    <div className="preview-tabs-left">
                      <button className={"preview-tab" + (previewTab === 'client' ? ' on' : '')} onClick={() => setPreviewTab('client')}>Client Preview</button>
                      <button className={"preview-tab" + (previewTab === 'email' ? ' on' : '')} onClick={() => setPreviewTab('email')}>Email Preview</button>
                    </div>
                    <div className="preview-tabs-right">
                      {previewTab === 'client' && (
                        <ClientColumnToggle columns={clientVis} onChange={setClientVis} />
                      )}
                    </div>
                  </div>
                  {/* Preview content */}
                  <div style={{flex: 1, overflowY: 'auto', padding: 24, background: 'var(--g50)'}}>
                    {previewTab === 'client' && <ClientPreview invoice={invoice} clientVis={clientVis} />}
                    {previewTab === 'email' && <EmailPreview invoice={invoice} />}
                  </div>
                </div>
              </div>

              <div className="bbar">
                <button className="btn btn-s" onClick={() => setPiModalOpen(true)}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  Client Preview
                </button>
                <div style={{flex: 1}}></div>
                <button className="btn btn-s">Cancel</button>
                <button className="btn btn-s">Save</button>
                <button className="btn btn-p">Send</button>
              </div>
            </div>
          </div>
          <EstimateModal
            open={estModalOpen}
            onClose={() => setEstModalOpen(false)}
            onAdd={handleAddFromEstimate}
            jobName={currentJob ? currentJob.name : 'Job name'}
          />
          <ProgressInvoiceModal
            open={piModalOpen}
            onClose={() => setPiModalOpen(false)}
            invoice={invoice}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
